name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: '17 9 * * *' }]
  repository_dispatch: { types: [content-update] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: IllyaStarikov/.dotfiles
          path: .sources/dotfiles
          sparse-checkout: |
            config/themes.json
            src/theme
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: IllyaStarikov/bin
          path: .sources/bin
      - uses: actions/checkout@v4
        with:
          repository: IllyaStarikov/academia
          path: .sources/academia
      # Restore transcoded academia media (GIF→mp4/webm + posters, PNGs) keyed
      # on PORTFOLIO.md so the ffmpeg prebuild runs once per source change, not
      # every nightly build. MUST come before `npm run build` (the transcode
      # step's digest cache skips whatever this restored). ffmpeg is preinstalled
      # on ubuntu-latest; the transcode script hard-fails if it's missing.
      - uses: actions/cache@v4
        with:
          path: public/media
          key: academia-media-${{ hashFiles('.sources/academia/PORTFOLIO.md') }}
          restore-keys: |
            academia-media-
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { BUILD_STRICT: "1" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
