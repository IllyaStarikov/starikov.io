name: Deploy
on:
  push: { branches: [main] }
  workflow_dispatch:
  schedule: [{ cron: '17 9 * * *' }]
  repository_dispatch: { types: [content-update] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone -- provenance dates
          # (ProvenanceFooter, /colophon's build disclosure) need real commit
          # history on THIS repo, same reason as the sparse dotfiles/bin/
          # academia checkouts below already pull real refs to read from.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: IllyaStarikov/.dotfiles
          path: .sources/dotfiles
          sparse-checkout: |
            config/themes.json
            src/theme
            src/neovim/lazy-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: IllyaStarikov/bin
          path: .sources/bin
          # Full history -- bin-tools.ts's `git log -1 -- <dir>` derives each
          # tool's "updated" date from THIS checkout's history; a shallow clone
          # collapses every tool's history to the shallow-boundary commit,
          # misdating every tool the day a second one lands.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: IllyaStarikov/academia
          path: .sources/academia
      # Restore transcoded academia media (GIF→mp4/webm + posters, AVIF/WebP)
      # keyed on PORTFOLIO.md so the ffmpeg/sharp prebuild runs once per source
      # change, not every nightly build. MUST come before `npm run build` (the
      # transcode step's digest cache skips whatever this restored).
      #
      # v2 (Task 2, v1.1 polish): scripts/transcode-media.mjs stopped copying
      # non-GIF images verbatim and started emitting AVIF+WebP instead -- a
      # cache restored under the OLD key would have the old verbatim PNG/JPG
      # copies sitting alongside (or instead of) the new outputs, and the OLD
      # digests.json would make the digest-skip decision think those stale
      # sources are already "done". Bumping the key (both here and in
      # restore-keys) forces a clean-slate rebuild once, so stale raw
      # originals and stale digests can never resurrect.
      - uses: actions/cache@v4
        with:
          path: public/media
          key: academia-media-v2-${{ hashFiles('.sources/academia/PORTFOLIO.md') }}
          restore-keys: |
            academia-media-v2-
      # Resilience middle tier (design spec §7 / A13): live -> .cache ->
      # committed vendor snapshot for Ghost essays and GitHub repo metadata,
      # plus Astro's own content-layer cache. Without this the middle tier was
      # dead -- every CI run started from an empty .cache/ (never persisted
      # across runs), so a live-fetch hiccup always fell straight to the
      # committed snapshot, the intended LAST resort, never the actual middle
      # one. Keyed on the lockfile (a dependency bump can change cache
      # shapes) plus a static suffix to bump on demand; restore-keys falls
      # back to the newest same-lockfile cache if the exact key ever misses.
      - uses: actions/cache@v4
        with:
          path: |
            .cache
            .astro
          key: build-cache-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            build-cache-
      # ffmpeg is NOT preinstalled on current ubuntu-latest images (every
      # deploy from Task 10 to Task 15 failed on this; the validate gate
      # correctly kept the last good deploy live). The transcode script
      # still hard-fails with ::error:: if this step is ever removed.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # theme-boot.test.mjs/theme-display.test.ts import src/data/generated/
      # themes.json, which only exists after scripts/build-themes.mjs has run
      # at least once. Locally it's always present as a leftover of a prior
      # `npm run build`; a fresh CI checkout has no such leftover, so the
      # tests-before-build step below would fail on a missing module. This
      # duplicates the build-themes.mjs invocation `npm run build` already
      # makes further down -- that's intentional: the script is idempotent
      # and cheap (regenerating themes.json/themes.generated.css again costs
      # a fraction of a second), and it keeps tests-before-build ordering
      # intact (see the fail-fast note below) instead of moving tests after
      # the full build.
      - run: node scripts/build-themes.mjs
      # Task 15 CARRIED FINDING (Task 10 review): CI never ran the test suite,
      # so a broken pure-logic change could still deploy as long as the build
      # itself didn't throw. Gate the deploy on it -- fast (< 1s locally) and
      # runs BEFORE the build so a red suite fails cheaply, before spending
      # time on theme generation / media transcode / astro build.
      - run: npx vitest run
      - run: npm run build
        env:
          BUILD_STRICT: "1"
          # Harmless while unset (Task 14: no Content API key exists yet --
          # ghost.ts's fetchLive fails fast and the build falls back to the
          # committed vendor snapshot with a warning, never an error).
          GHOST_CONTENT_API_KEY: ${{ secrets.GHOST_CONTENT_API_KEY }}
          # Authenticates github-meta.ts's per-repo fetch (5000 req/hr) --
          # unauthenticated shared-runner IPs share a 60 req/hr GitHub API cap.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
